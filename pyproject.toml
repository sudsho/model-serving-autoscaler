[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "model-serving-autoscaler"
version = "0.1.0"
description = "KServe-based multi-model serving with autoscaling"
authors = [{ name = "Sudhanshu Srivastava" }]
requires-python = ">=3.11"
license = { text = "MIT" }
readme = "README.md"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --tb=short"

[tool.ruff]
line-length = 100
target-version = "py311"
